  - heading "What I would want you to look at" [level=3] [ref=f4e39]
  - paragraph [ref=f4e40]: HouseCheck's export. A tenant lawyer can read a building's violations on any city website; what they cannot do is put that reading in front of a court, because a printout is unverifiable. The export carries an append-only hash chain and an Ed25519 signature, so opposing counsel can re-check it offline without trusting us.
  - paragraph [ref=f4e41]: "The part I am prouder of than the cryptography: while verifying it in production I wrote an independent verifier in another language and found that signing alone was not enough. A forger who rewrites a row, recomputes the whole chain and signs it with their own keypair produces a document that verifies as intact — because it is internally consistent. The fix was publishing the public key so a reader has something to compare against."
  - heading "How I work" [level=3] [ref=f4e42]
  - paragraph [ref=f4e43]: Measure, don't estimate. Figures in these repos are measured and say so; anything derived is labelled derived, anything unverified says unverified.
  - paragraph [ref=f4e44]: Verify against production, not the repo. Nearly every real defect I found in the final week was invisible from inside the editor — a search box that answered a Manhattan address with a Brooklyn building, a failed lookup that silently kept the previous result on screen.
  - paragraph [ref=f4e45]: An absent answer is still an answer. Repeatedly the honest design has three states rather than two. Collapsing the middle one is how software ends up stating something reassuring it has not earned.

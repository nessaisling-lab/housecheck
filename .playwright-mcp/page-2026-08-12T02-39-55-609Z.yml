  - heading "If you only read one thing" [level=2] [ref=f5e60]
  - generic [ref=f5e61]:
    - heading "The export that found its own hole" [level=3] [ref=f5e62]
    - paragraph [ref=f5e63]: A tenant lawyer can read a building's violations on any city website. What they cannot do is put that reading in front of a court, because a printout is unverifiable. HouseCheck's export carries an append-only hash chain and an Ed25519 signature, so opposing counsel can re-check it offline — without trusting us and without reaching our servers.
    - paragraph [ref=f5e64]:
      - text: "The part I am prouder of than the cryptography: while verifying it in production I wrote an independent verifier in another language, and found that signing alone was not enough. A forger who rewrites a row, recomputes the whole chain and signs it with their own keypair produces a document that verifies as intact — because it is internally consistent. A row rewritten to"
      - code [ref=f5e65]: NO VIOLATIONS OF ANY KIND AT THIS ADDRESS
      - text: passed cleanly.
    - paragraph [ref=f5e66]:
      - text: The fix was publishing the public key at a stable endpoint, so a reader has something to compare against. That hole existed because the code's own comment said
      - emphasis [ref=f5e67]: “compare with the published one”
      - text: while nothing published it.
  - heading "How I work" [level=2] [ref=f5e68]
  - generic [ref=f5e69]:
    - generic [ref=f5e70]:
      - heading "Measure, don't estimate." [level=4] [ref=f5e71]
      - paragraph [ref=f5e72]: "Figures in these repos are measured and say so. Anything derived is labelled derived; anything unverified says unverified. HouseCheck's backlog carries the rule in writing: an item with no reason is a wish, not a task."
    - generic [ref=f5e73]:
      - heading "Verify against production, not the repo." [level=4] [ref=f5e74]
      - paragraph [ref=f5e75]: Nearly every real defect I found in the final week was invisible from inside the editor — a search box that answered a Manhattan address with a Brooklyn building, a failed lookup that silently kept the previous result on screen, an assistant that answered a different question than the one asked.
    - generic [ref=f5e76]:
      - heading "An absent answer is still an answer." [level=4] [ref=f5e77]
      - paragraph [ref=f5e78]: "Repeatedly the honest design has three states rather than two: signed / unsigned-but-intact / tampered. A repair-time median / “nothing has been closed” / genuinely no data. Collapsing the middle state is how software ends up stating something reassuring it has not earned."

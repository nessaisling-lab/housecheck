  - heading "If you only read one thing" [level=2] [ref=e61]
  - generic [ref=e62]:
    - heading "The export that found its own hole" [level=3] [ref=e63]
    - paragraph [ref=e64]: A tenant lawyer can read a building's violations on any city website. What they cannot do is put that reading in front of a court, because a printout is unverifiable. HouseCheck's export carries an append-only hash chain and an Ed25519 signature, so opposing counsel can re-check it offline — without trusting us and without reaching our servers.
    - paragraph [ref=e65]:
      - text: "The part I am prouder of than the cryptography: while verifying it in production I wrote an independent verifier in another language, and found that signing alone was not enough. A forger who rewrites a row, recomputes the whole chain and signs it with their own keypair produces a document that verifies as intact — because it is internally consistent. A row rewritten to"
      - code [ref=e66]: NO VIOLATIONS OF ANY KIND AT THIS ADDRESS
      - text: passed cleanly.
    - paragraph [ref=e67]:
      - text: The fix was publishing the public key at a stable endpoint, so a reader has something to compare against. That hole existed because the code's own comment said
      - emphasis [ref=e68]: “compare with the published one”
      - text: while nothing published it.
  - heading "Why Rust, specifically" [level=2] [ref=e69]
  - generic [ref=e70]:
    - heading "Three of the four have a property a type system can defend." [level=3] [ref=e71]
    - paragraph [ref=e72]:
      - text: HouseCheck signs a document a court might rely on. SiteAssure keeps a safety log that has to stay tamper-evident. Resona promises that audio never leaves the machine. In each case the product's whole claim is a guarantee about what the program will
      - emphasis [ref=e73]: not
      - text: do — and a guarantee is easier to hold when the compiler is checking it than when a test suite is remembering to.
    - paragraph [ref=e74]: "The practical payoff is boring and real: a read-only SQLite artefact baked into a container with no database server and no connection pool; a desktop app that ships one binary; 149 tests and clippy-clean on the current build, with correctness bugs re-measured across the whole dataset rather than spot-checked."

  - heading "How I work" [level=2] [ref=e85]
  - generic [ref=e86]:
    - generic [ref=e87]:
      - heading "Measure, don't estimate." [level=4] [ref=e88]
      - paragraph [ref=e89]: "Figures in these repos are measured and say so. Anything derived is labelled derived; anything unverified says unverified. HouseCheck's backlog carries the rule in writing: an item with no reason is a wish, not a task."
    - generic [ref=e90]:
      - heading "Verify against production, not the repo." [level=4] [ref=e91]
      - paragraph [ref=e92]: Nearly every real defect I found in the final week was invisible from inside the editor — a search box that answered a Manhattan address with a Brooklyn building, a failed lookup that silently kept the previous result on screen, an assistant that answered a different question than the one asked.
    - generic [ref=e93]:
      - heading "An absent answer is still an answer." [level=4] [ref=e94]
      - paragraph [ref=e95]: "Repeatedly the honest design has three states rather than two: signed / unsigned-but-intact / tampered. A repair-time median / “nothing has been closed” / genuinely no data. Collapsing the middle state is how software ends up stating something reassuring it has not earned."

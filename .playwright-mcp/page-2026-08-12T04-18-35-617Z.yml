  - heading "How I work" [level=2] [ref=f1e85]
  - generic [ref=f1e86]:
    - generic [ref=f1e87]:
      - heading "Measure, don't estimate." [level=4] [ref=f1e88]
      - paragraph [ref=f1e89]: "Figures in these repos are measured and say so. Anything derived is labelled derived; anything unverified says unverified. HouseCheck's backlog carries the rule in writing: an item with no reason is a wish, not a task."
    - generic [ref=f1e90]:
      - heading "Verify against production, not the repo." [level=4] [ref=f1e91]
      - paragraph [ref=f1e92]: Nearly every real defect I found in the final week was invisible from inside the editor — a search box that answered a Manhattan address with a Brooklyn building, a failed lookup that silently kept the previous result on screen, an assistant that answered a different question than the one asked.
    - generic [ref=f1e93]:
      - heading "An absent answer is still an answer." [level=4] [ref=f1e94]
      - paragraph [ref=f1e95]: "Repeatedly the honest design has three states rather than two: signed / unsigned-but-intact / tampered. A repair-time median / “nothing has been closed” / genuinely no data. Collapsing the middle state is how software ends up stating something reassuring it has not earned."

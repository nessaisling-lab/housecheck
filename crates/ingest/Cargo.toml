[package]
name = "ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
store = { path = "../store" }
model = { path = "../model" }
anyhow.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "gzip"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled"] }
# Law check: one entry of amlegal's bulk zip is inflated after a byte-range read. Already in
# the tree through reqwest's gzip.
flate2 = "1"
# Law check: the bulk Admin Code XML. Small, no dependencies of its own.
roxmltree = "0.21"

[package]
name = "mcp"
version = "0.1.0"
edition.workspace = true
description = "HouseCheck as an MCP tool, so another agent can look up a building and get the same card the website serves."

[[bin]]
name = "housecheck-mcp"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
card = { path = "../card" }
store = { path = "../store" }
# Official Rust MCP SDK, Apache-2.0. The mcp-ui/MCP Apps SDKs are TypeScript, Ruby and
# Python only -- but they merely assemble a JSON resource, so step 2's `ui://` resource
# can be emitted from here without adding a JavaScript toolchain.
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[package]
name = "store"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Pure-Rust zlib (miniz_oxide backend, no C toolchain). Used only to block-compress
# violation descriptions -- see `insert_violations`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
model = { path = "../model" }
rusqlite.workspace = true
anyhow.workspace = true

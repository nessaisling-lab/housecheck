</g>
<line x1="263.8" y1="-22.0" x2="278.8" y2="-22.0" stroke="#5C6472" stroke-opacity=".35" stroke-width="1"/>
<text x="285.8" y="-21.0" font-size="17" fill="#14161C" font-weight="600">Docker image</text>
<text x="285.8" y="-4.0" font-size="10.5" fill="#5C6472" font-family="ui-monospace,Menlo,Consolas,'Courier New',monospace">29 MB · debian-slim + one static binary</text>
<text x="285.8" y="15.0" font-size="11.5" fill="#14161C">COPY data/housecheck.db — the database ships inside</text>
<text x="285.8" y="30.0" font-size="11.5" fill="#14161C">No database URL. No password. No secret in the image.</text>
<g stroke="#14161C" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round">
<polygon points="-164.5,9.0 95.3,159.0 95.3,172.0 -164.5,22.0" fill="#8B8170"/>

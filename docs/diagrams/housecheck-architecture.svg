<text x="285.8" y="-262.0" font-size="10.5" fill="#5C6472" font-family="ui-monospace,Menlo,Consolas,'Courier New',monospace">Socrata · Census · JustFix · MTA</text>
<text x="285.8" y="-243.0" font-size="11.5" fill="#14161C">HPD wvxf-dwi5 · 311 erm2-nwe9 · PLUTO 64uk-42ks</text>
<text x="285.8" y="-228.0" font-size="11.5" fill="#14161C">DOB e5aq-a4j2 · DOHMH 43nn-pn8j · ACS B25064</text>

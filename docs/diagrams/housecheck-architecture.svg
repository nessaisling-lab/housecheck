<svg xmlns="http://www.w3.org/2000/svg" viewBox="-514.5 -492.0 1254.3 804.0" width="1254" height="804" font-family="Georgia,'Times New Roman',serif" role="img" aria-labelledby="t d">
<title id="t">HouseCheck architecture: six layers from municipal sources to a React client</title>
<desc id="d">An isometric stack of six layers. Eight municipal data sources feed a one-time ingest that runs on a laptop. The ingest writes a 1,240 KB SQLite artifact. The artifact is baked into a 29 MB Docker image. The image runs as an axum API on Fly.io with scale-to-zero. A React client on Vercel reads it. Everything above the artifact happens once and touches the network; everything below is deterministic and ships.</desc>
<rect x="-514.5" y="-492.0" width="1254.3" height="804.0" fill="#F7F6F3"/>
<text x="-478.5" y="-438.0" font-size="11.5" fill="#5C6472" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="2.2">HOUSECHECK · BUILD ARCHITECTURE</text>
<text x="-478.5" y="-402.0" font-size="30" fill="#14161C" font-weight="600">One artifact,</text>
<text x="-478.5" y="-370.0" font-size="30" fill="#14161C" font-weight="600">six layers.</text>
<text x="-478.5" y="-342.0" font-size="14" fill="#5C6472">Nothing here is fast, because</text>
<text x="-478.5" y="-324.0" font-size="14" fill="#5C6472">nothing needed to be.</text>

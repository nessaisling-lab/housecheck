<text x="-478.5" y="-96.5" font-size="12.5" fill="#14161C">Above — runs once, on a laptop,</text>
<text x="-478.5" y="-79.5" font-size="12.5" fill="#14161C">over the network. Not reproducible.</text>
<text x="-478.5" y="-56.5" font-size="12.5" fill="#14161C">Below — deterministic, offline,</text>
<text x="-478.5" y="-39.5" font-size="12.5" fill="#14161C">and shipped. Same answer in 2030.</text>
<rect x="-478.5" y="30.5" width="268.0" height="92" rx="7" fill="#FFFFFF" stroke="#14161C" stroke-opacity=".2"/>

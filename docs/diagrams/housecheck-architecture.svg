<text x="285.8" y="101.0" font-size="11.5" fill="#14161C">824 lines REST · 1,258 agent · 947 tests</text>
<text x="285.8" y="116.0" font-size="11.5" fill="#14161C">167 ms cold start · 2.2 ms per card · 21 ms for all 250</text>

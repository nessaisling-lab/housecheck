# fly.toml app configuration file generated for housecheck-nessa on 2026-07-23T14:05:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'housecheck-nessa'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm. This URL is presented in Pursuit's lookbook portfolio to
  # employers and partner companies, so an unknown visitor's first click must not wait
  # on a cold container start. The second machine still scales to zero, and keeping two
  # provisioned is what makes deploys and secret changes zero-downtime (rolling update).
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
